name: wif-probe-perms
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: sts
        run: |
          set -u
          PROV="projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github"
          AUD="//iam.googleapis.com/$PROV"
          OIDC_RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")
          JWT=$(printf '%s' "$OIDC_RESP" | jq -r .value)
          STS=$(curl -sS -X POST https://sts.googleapis.com/v1/token -H 'Content-Type: application/json' -d "{\"audience\":\"$AUD\",\"grantType\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"requestedTokenType\":\"urn:ietf:params:oauth:token-type:access_token\",\"subjectTokenType\":\"urn:ietf:params:oauth:token-type:jwt\",\"subjectToken\":\"$JWT\",\"scope\":\"https://www.googleapis.com/auth/cloud-platform\"}")
          AT=$(printf '%s' "$STS" | jq -r '.access_token // empty')
          echo "access_token_len=${#AT}"
          echo "=== CRM projects list (body)"
          curl -sS -w '\nHTTP=%{http_code}\n' -H "Authorization: Bearer $AT" "https://cloudresourcemanager.googleapis.com/v1/projects" | head -c 2000
          echo
          echo "=== CRM project get 305452601764"
          curl -sS -w '\nHTTP=%{http_code}\n' -H "Authorization: Bearer $AT" "https://cloudresourcemanager.googleapis.com/v1/projects/305452601764" | head -c 800
          echo
          echo "=== bucket testIamPermissions oss-exit-gate-prod-projects-bucket"
          curl -sS -w '\nHTTP=%{http_code}\n' -X POST -H "Authorization: Bearer $AT" "https://storage.googleapis.com/storage/v1/b/oss-exit-gate-prod-projects-bucket/iam/testPermissions?permissions=storage.objects.create&permissions=storage.objects.get&permissions=storage.objects.list&permissions=storage.objects.delete&permissions=storage.buckets.get" | head -c 800
          echo
          echo "=== AR repositories list oss-exit-gate-prod us"
          curl -sS -w '\nHTTP=%{http_code}\n' -H "Authorization: Bearer $AT" "https://artifactregistry.googleapis.com/v1/projects/oss-exit-gate-prod/locations/us/repositories" | head -c 1200
          echo
          echo "=== AR testIamPermissions repo disentangled-rnns--pypi"
          curl -sS -w '\nHTTP=%{http_code}\n' -X POST -H "Authorization: Bearer $AT" -H 'Content-Type: application/json' -d '{"permissions":["artifactregistry.repositories.uploadArtifacts","artifactregistry.repositories.downloadArtifacts","artifactregistry.repositories.readViaVirtualRepository"]}' "https://artifactregistry.googleapis.com/v1/projects/oss-exit-gate-prod/locations/us/repositories/disentangled-rnns--pypi:testIamPermissions" | head -c 800
          echo
